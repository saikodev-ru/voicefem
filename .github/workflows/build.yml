name: Build VST3 (Windows)

on:
  push:
  workflow_dispatch:
    inputs:
      neural:
        description: 'Build with the neural engine (uncheck = DSP-only diagnostic build)'
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (!(Test-Path $vswhere)) {
            Write-Error "Visual Studio Installer not found"
            exit 1
          }

          $vsPath = & $vswhere -latest -products '*' -property installationPath

          if (!$vsPath) {
            Write-Error "Visual Studio installation not found"
            exit 1
          }

          Write-Host "Visual Studio found: $vsPath"
          cmake --version

      - name: Configure
        shell: pwsh
        run: |
          $neural = "ON"
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and "${{ inputs.neural }}" -eq "false") { $neural = "OFF" }
          Write-Host "DYV_NEURAL=$neural"
          # pass the toggle through an initial-cache script: pwsh can mangle
          # bare -DVAR=VALUE tokens, -C <file> cannot be mis-parsed
          "set(DYV_NEURAL $neural CACHE BOOL ""neural engine toggle"" FORCE)" | Out-File -Encoding ascii init_cache.cmake
          Get-Content init_cache.cmake
          cmake -B build -S . -G "Visual Studio 18 2026" -A x64 -C init_cache.cmake

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify VST3 bundle
        shell: pwsh
        run: |
          $bundle = "build/DyVocalizer_artefacts/Release/VST3/DyVocalizer.vst3"
          if (!(Test-Path $bundle)) { Write-Error "VST3 bundle not found"; exit 1 }
          Get-ChildItem -Recurse $bundle | ForEach-Object { Write-Host "$($_.Length) bytes  $($_.FullName)" }
          $dspOnly = ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and "${{ inputs.neural }}" -eq "false")
          $ort = Join-Path $bundle "Contents/x86_64-win/onnxruntime.dll"
          if ($dspOnly) {
            if (Test-Path $ort) { Write-Error "DSP-only build must not contain onnxruntime.dll"; exit 1 }
            Write-Host "OK: DSP-only bundle verified (no ORT dependency)"
          } else {
            if (!(Test-Path $ort)) { Write-Error "onnxruntime.dll is missing from the bundle - hosts will fail to load the plugin"; exit 1 }
            Write-Host "OK: onnxruntime.dll bundled ($((Get-Item $ort).Length) bytes)"
          }

      - name: Upload VST3 plugin
        uses: actions/upload-artifact@v4
        with:
          name: DyVocalizer-VST3${{ github.event_name == 'workflow_dispatch' && inputs.neural == false && '-DSPonly' || '' }}
          path: build/DyVocalizer_artefacts/Release/VST3/
          if-no-files-found: error
